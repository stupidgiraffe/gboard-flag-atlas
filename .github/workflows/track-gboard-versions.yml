name: Track public Gboard versions

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: gboard-upstream-tracker
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate parsing
        run: node --test tests/upstream-tracker.test.mjs
      - name: Read public version sources
        id: scan
        run: node scripts/check-upstream-versions.mjs
      - name: Open a deduplicated issue when Gboard versions change
        if: steps.scan.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_KEY: ${{ steps.scan.outputs.event_key }}
        run: |
          title="Gboard upstream version update [$EVENT_KEY]"
          if ! gh issue list --state all --limit 100 --json title --jq '.[].title' | grep -Fxq "$title"; then
            gh issue create --title "$title" --body-file /tmp/gboard-version-report.md
          fi
      - name: Persist new version history
        if: steps.scan.outputs.state_changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/upstream-versions.json
          git commit -m 'chore: track upstream Gboard version metadata'
          git push
